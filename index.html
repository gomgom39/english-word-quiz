<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>매일 영어 단어 퀴즈</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#18233d;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:570px;margin:auto;padding:24px 17px 50px}.eyebrow{color:#5267c8;font-weight:750;font-size:13px;letter-spacing:1px}h1{font-size:30px;margin:7px 0 8px}.sub{color:#65718a;font-size:14px;line-height:1.6}.panel{background:white;border:1px solid #e7ebf4;border-radius:22px;padding:23px;margin-top:19px;box-shadow:0 8px 26px #17275409}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.stat{background:#edf1ff;border-radius:14px;padding:12px 7px;text-align:center}.stat strong{display:block;font-size:21px;color:#304fc5}.stat small{color:#64718d;font-size:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}select,button{font:inherit}select{border:1px solid #d9e0ef;border-radius:10px;padding:9px;background:white}button{cursor:pointer;border:0;border-radius:14px;padding:14px 16px;font-weight:700}button.primary{background:#405bd8;color:white;width:100%}button.secondary{background:#eaf0ff;color:#314dc0}button.outline{background:white;border:1px solid #d9e1f0;color:#42516e}.progress{height:8px;border-radius:20px;background:#edf0f7;overflow:hidden;margin:15px 0 25px}.progress div{height:100%;background:#5b76e8;transition:width .2s}.word{font-size:38px;letter-spacing:-1px;font-weight:800;margin:12px 0 22px;overflow-wrap:anywhere}.option{display:block;text-align:left;width:100%;background:#f7f9fd;border:1.5px solid #e3e8f1;margin:10px 0;padding:16px;border-radius:13px;font-size:16px;color:#24314d}.option:disabled{cursor:default}.option.good{border-color:#29a77a;background:#e8f9f0;color:#126c4c}.option.bad{border-color:#e56d75;background:#fff0f0;color:#a73343}.example{background:#f0f5ff;border-radius:15px;padding:18px;margin:18px 0;line-height:1.7}.example b{font-size:16px}.example p{margin:6px 0 0;color:#52627e;font-size:14px}.feedback{font-weight:800;margin:16px 0}.hidden{display:none!important}.small{font-size:12px;color:#7b8498}.footer{margin-top:20px;color:#7b8498;text-align:center;font-size:12px} .word-with-audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 22px}.word-with-audio .word{margin:0;min-width:0}.speak-btn{background:#eaf0ff;color:#314dc0;border:1px solid #d9e1f0;border-radius:13px;padding:10px 12px;font-size:14px;white-space:nowrap}.speak-btn:active{background:#dce6ff}.speak-btn:disabled{opacity:.55;cursor:not-allowed}</style></head><body><main class="wrap"><div class="eyebrow">DAILY ENGLISH · VOCAB QUIZ</div><h1>하루 10분, 영어 한 걸음</h1><div class="sub">직접 정리한 단어로 공부하고, 실생활 예문으로 기억해요.</div><div class="stats"><div class="stat"><strong id="statTotal">0</strong><small>공부한 단어</small></div><div class="stat"><strong id="statWrong">0</strong><small>복습할 단어</small></div><div class="stat"><strong id="statDays">0</strong><small>학습한 날짜</small></div></div><section class="panel" id="home"><h2>오늘의 단어 공부 📚</h2><p class="sub">총 <b id="totalWords"></b>개 단어 수록 · 4지선다 · 정답 후 예문 공개</p><div class="line" style="margin:22px 0"><label for="dailyCount"><b>오늘 풀 문제 수</b></label><select id="dailyCount"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></div><button class="primary" id="start">새 단어 퀴즈 시작 →</button><button class="secondary" style="width:100%;margin-top:10px" id="review">틀린 단어 복습하기</button><p class="small">학습 기록은 이 기기의 브라우저에 저장됩니다. 다른 기기나 브라우저에서는 기록이 공유되지 않아요.</p></section><section class="panel hidden" id="quiz"><div class="line"><b id="counter"></b><button class="outline" style="padding:7px 12px" id="homeBtn">나가기</button></div><div class="progress"><div id="bar"></div></div><div class="small">다음 영어 단어의 뜻은 무엇일까요?</div><div class="word-with-audio"><div class="word" id="word"></div><button type="button" id="speakWord" class="speak-btn" aria-label="영어 단어 발음 듣기" title="영어 단어 발음 듣기">🔊 <span>발음 듣기</span></button></div><div id="choices"></div><div class="feedback" id="feedback"></div><div class="example hidden" id="example"><div class="small" style="color:#425dbf;font-weight:800">💬 실생활 영어 예문</div><b id="sentence"></b><p id="translation"></p></div><button class="primary hidden" id="next">다음 문제 →</button></section><section class="panel hidden" id="result"><h2>오늘도 공부 완료! 🎉</h2><div class="word" id="resultScore"></div><p class="sub" id="resultDesc"></p><button class="primary" id="retry">이번에 틀린 단어 다시 풀기</button><button class="secondary" style="width:100%;margin-top:10px" id="resultHome">처음으로</button></section><div class="footer">꾸준히, 조금씩. 내일도 이어서 공부해요.</div></main><script>const WORDS=[{"word": "zookeeper", "meaning": "사육사", "example": "The zookeeper feeds the animals every morning.", "translation": "사육사는 매일 아침 동물들에게 먹이를 줘요."}, {"word": "calf", "meaning": "송아지", "example": "We saw a baby calf on the farm.", "translation": "우리는 농장에서 새끼 송아지를 봤어요."}, {"word": "buttock", "meaning": "엉덩이", "example": "I fell and hurt my buttock.", "translation": "넘어져서 엉덩이를 다쳤어요."}, {"word": "nephew", "meaning": "남자 조카", "example": "My nephew starts school next week.", "translation": "제 남자 조카는 다음 주에 학교에 가요."}, {"word": "niece", "meaning": "여자 조카", "example": "My niece loves drawing.", "translation": "제 여자 조카는 그림 그리기를 좋아해요."}, {"word": "forehead", "meaning": "이마", "example": "She touched my forehead to check my temperature.", "translation": "그녀는 열을 확인하려고 내 이마를 만졌어요."}, {"word": "jaw", "meaning": "턱", "example": "My jaw hurts when I chew.", "translation": "씹을 때 턱이 아파요."}, {"word": "chin", "meaning": "턱끝", "example": "Rest your chin on your hand.", "translation": "손에 턱을 괴세요."}, {"word": "gums", "meaning": "잇몸", "example": "My gums bleed when I brush my teeth.", "translation": "양치할 때 잇몸에서 피가 나요."}, {"word": "braces", "meaning": "치아 교정기", "example": "I got braces last month.", "translation": "지난달에 치아 교정기를 했어요."}, {"word": "nostril", "meaning": "콧구멍", "example": "One nostril is blocked.", "translation": "콧구멍 한쪽이 막혔어요."}, {"word": "generous", "meaning": "관대한, 후한", "example": "That was very generous of you.", "translation": "정말 후하게 베풀어 주셨네요."}, {"word": "pond", "meaning": "연못", "example": "There are ducks in the pond.", "translation": "연못에 오리들이 있어요."}, {"word": "diligent", "meaning": "성실한", "example": "She is a diligent student.", "translation": "그녀는 성실한 학생이에요."}, {"word": "rash", "meaning": "발진", "example": "I have a rash on my arm.", "translation": "팔에 발진이 생겼어요."}, {"word": "blister", "meaning": "물집", "example": "These shoes gave me a blister.", "translation": "이 신발 때문에 물집이 생겼어요."}, {"word": "sneeze", "meaning": "재채기하다", "example": "I always sneeze when I smell pepper.", "translation": "후추 냄새를 맡으면 늘 재채기가 나요."}, {"word": "sprained ankle", "meaning": "삔 발목", "example": "I can't run because of my sprained ankle.", "translation": "발목을 삐어서 달릴 수 없어요."}, {"word": "feel dizzy", "meaning": "어지럽다", "example": "I feel dizzy when I stand up too fast.", "translation": "너무 빨리 일어나면 어지러워요."}, {"word": "strict", "meaning": "엄격한", "example": "Our teacher is strict about deadlines.", "translation": "우리 선생님은 마감 기한에 엄격해요."}, {"word": "faucet", "meaning": "수도꼭지", "example": "Please turn off the faucet.", "translation": "수도꼭지를 잠가 주세요."}, {"word": "bathtub", "meaning": "욕조", "example": "The bathtub is full of warm water.", "translation": "욕조에 따뜻한 물이 가득해요."}, {"word": "drain", "meaning": "배수구", "example": "The shower drain is clogged.", "translation": "샤워실 배수구가 막혔어요."}, {"word": "towel rack", "meaning": "수건걸이", "example": "Hang the towel on the towel rack.", "translation": "수건걸이에 수건을 걸어 주세요."}, {"word": "scale", "meaning": "저울", "example": "Put the flour on the scale.", "translation": "밀가루를 저울에 올려요."}, {"word": "umpire", "meaning": "심판", "example": "The umpire called it a strike.", "translation": "심판이 스트라이크를 선언했어요."}, {"word": "astronaut", "meaning": "우주비행사", "example": "She dreams of becoming an astronaut.", "translation": "그녀는 우주비행사가 되는 꿈을 꿔요."}, {"word": "ostrich", "meaning": "타조", "example": "An ostrich can run very fast.", "translation": "타조는 매우 빨리 달릴 수 있어요."}, {"word": "injection", "meaning": "주사", "example": "I got an injection at the clinic.", "translation": "병원에서 주사를 맞았어요."}, {"word": "envelope", "meaning": "봉투", "example": "Put the letter in an envelope.", "translation": "편지를 봉투에 넣으세요."}, {"word": "fountain", "meaning": "분수", "example": "Let's meet by the fountain.", "translation": "분수 옆에서 만나요."}, {"word": "fireworks", "meaning": "불꽃놀이", "example": "We watched fireworks last night.", "translation": "어젯밤 불꽃놀이를 봤어요."}, {"word": "chimney", "meaning": "굴뚝", "example": "Smoke came out of the chimney.", "translation": "굴뚝에서 연기가 나왔어요."}, {"word": "kidney", "meaning": "신장, 콩팥", "example": "The doctor checked my kidney function.", "translation": "의사가 제 신장 기능을 확인했어요."}, {"word": "sparrow", "meaning": "참새", "example": "A sparrow landed on the window.", "translation": "참새 한 마리가 창가에 앉았어요."}, {"word": "apricot", "meaning": "살구", "example": "I bought fresh apricots at the market.", "translation": "시장에서 신선한 살구를 샀어요."}, {"word": "tangerine", "meaning": "귤", "example": "I eat a tangerine after lunch.", "translation": "점심 후에 귤을 먹어요."}, {"word": "raspberry", "meaning": "산딸기", "example": "I added raspberries to my yogurt.", "translation": "요거트에 산딸기를 넣었어요."}, {"word": "raisin", "meaning": "건포도", "example": "This bread has raisins in it.", "translation": "이 빵에는 건포도가 들어 있어요."}, {"word": "lettuce", "meaning": "상추, 양상추", "example": "Add some lettuce to the sandwich.", "translation": "샌드위치에 상추를 넣으세요."}, {"word": "cabbage", "meaning": "양배추", "example": "I made cabbage soup for dinner.", "translation": "저녁으로 양배추 수프를 만들었어요."}, {"word": "zucchini", "meaning": "애호박", "example": "Slice the zucchini into thin pieces.", "translation": "애호박을 얇게 썰어 주세요."}, {"word": "radish", "meaning": "무", "example": "We need a radish for the soup.", "translation": "국에 넣을 무가 필요해요."}, {"word": "celery", "meaning": "셀러리", "example": "I put celery in the salad.", "translation": "샐러드에 셀러리를 넣었어요."}, {"word": "parsley", "meaning": "파슬리", "example": "Sprinkle some parsley on top.", "translation": "위에 파슬리를 조금 뿌리세요."}, {"word": "spinach", "meaning": "시금치", "example": "Spinach is in today's lunch.", "translation": "오늘 점심에 시금치가 나와요."}, {"word": "kidney bean", "meaning": "강낭콩", "example": "I added kidney beans to the chili.", "translation": "칠리에 강낭콩을 넣었어요."}, {"word": "green onion", "meaning": "대파", "example": "Chop the green onion for the soup.", "translation": "국에 넣을 대파를 썰어 주세요."}, {"word": "mussel", "meaning": "홍합", "example": "We ordered steamed mussels.", "translation": "우리는 찐 홍합을 주문했어요."}, {"word": "clam", "meaning": "조개", "example": "This pasta has clams in it.", "translation": "이 파스타에는 조개가 들어 있어요."}, {"word": "scallop", "meaning": "가리비", "example": "I grilled scallops for dinner.", "translation": "저녁으로 가리비를 구웠어요."}, {"word": "eel", "meaning": "장어", "example": "My family ate grilled eel.", "translation": "우리 가족은 장어구이를 먹었어요."}, {"word": "ray", "meaning": "가오리, 홍어", "example": "We saw a ray at the aquarium.", "translation": "수족관에서 가오리를 봤어요."}, {"word": "apply", "meaning": "신청하다, 지원하다, 바르다", "example": "I want to apply for this job.", "translation": "이 일자리에 지원하고 싶어요."}, {"word": "accompany", "meaning": "동행하다, 반주하다", "example": "Can you accompany me to the hospital?", "translation": "병원에 같이 가 줄래요?"}, {"word": "relay", "meaning": "전달하다, 릴레이", "example": "Please relay this message to her.", "translation": "이 메시지를 그녀에게 전달해 주세요."}, {"word": "bury", "meaning": "묻다, 매장하다", "example": "The dog buried its toy in the yard.", "translation": "개가 장난감을 마당에 묻었어요."}, {"word": "barley", "meaning": "보리", "example": "This tea is made from barley.", "translation": "이 차는 보리로 만들었어요."}, {"word": "rye", "meaning": "호밀", "example": "I bought rye bread today.", "translation": "오늘 호밀빵을 샀어요."}, {"word": "wheat", "meaning": "밀", "example": "This bread is made from wheat.", "trans
